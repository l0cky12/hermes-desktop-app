[package]
name = "hermes-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# All gateway HTTP + SSE (ADR 0001); rustls uses the platform trust store, no custom cert handling.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# OS keyring: Secret Service (Linux), Keychain (macOS), Credential Manager (Windows).
keyring = "4"
# Image attachments are sent as base64 data URLs.
base64 = "0.22"
# `ssh host hermes acp` child process and its JSON-RPC plumbing (acp.rs); same tokio Tauri runs on.
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }
# Native save dialog for Share and Export as HTML; the file itself is written here in Rust.
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Dictation needs getUserMedia, which WebKitGTK ships switched off; same crate Tauri already uses.
webkit2gtk = { version = "2", features = ["v2_40"] }
